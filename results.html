<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
  name="description"
  content="Explore Levan Gelashvili’s competition results, medals, match statistics, and defining moments from the 2026 judo season."
/>
    <script
      src="https://kit.fontawesome.com/424c0b4b20.js"
      crossorigin="anonymous"
    ></script>
      <link rel="stylesheet" href=".//css/reset.css">
      <link rel="stylesheet" href=".//css/tokens.css">
      <link rel="stylesheet" href=".//css/global.css">
      <link rel="stylesheet" href=".//css/results.css">
    <title>Results | Levan Gelashvili</title>
  </head>
  <body>
    <div id="header"></div>
    <section class="results-hero">
  <div class="container">
    <div class="results-line top"></div>
    <p class="results-subtitle">2026 SEASON</p>
    <h1 class="results-title">RESULTS</h1>
    <p class="results-description">
      Every competition, every medal and every match that shaped the 2026
      season.
    </p>
  </div>
</section>
<section class="results-analytics">
  <div class="container">
    <div class="results-analytics-grid">
      <article class="stat-card stat-card-featured" data-index="01">
        <div class="stat-card-main">
          <h3 class="stat-heading">2026 PODIUMS</h3>
          <div class="stat-value stat-podiums">6 / 7</div>
        </div>
        <div class="stat-card-divider" aria-hidden="true"></div>
        <div class="stat-medals">
          <h3>2026 MEDALS</h3>
          <div class="medal-breakdown">
            <div class="medal-stat gold" aria-label="Three gold medals">
              <span class="medal-icon" aria-hidden="true">
                <span class="medal-ribbon"></span>
                <span class="medal-disc">1</span>
              </span>
              <span class="medal-name">GOLD</span>
              <strong>X3</strong>
            </div>
            <div class="medal-stat silver" aria-label="Two silver medals">
              <span class="medal-icon" aria-hidden="true">
                <span class="medal-ribbon"></span>
                <span class="medal-disc">2</span>
              </span>
              <span class="medal-name">SILVER</span>
              <strong>X2</strong>
            </div>
            <div class="medal-stat bronze" aria-label="One bronze medal">
              <span class="medal-icon" aria-hidden="true">
                <span class="medal-ribbon"></span>
                <span class="medal-disc">3</span>
              </span>
              <span class="medal-name">BRONZE</span>
              <strong>X1</strong>
            </div>
          </div>
        </div>
      </article>
      <article class="stat-card" data-index="02">
        <h3 class="stat-heading">TOTAL TIME ON MAT</h3>
        <div class="stat-value">48 MIN</div>
      </article>
      <article class="stat-card" data-index="03">
        <h3 class="stat-heading">FASTEST IPPON</h3>
        <div class="stat-value">0:14</div>
      </article>
      <article class="stat-card" data-index="04">
        <h3 class="stat-heading">2026 MATCH RECORD</h3>
        <div class="stat-value">27 / 21</div>
      </article>
      <article class="stat-card" data-index="05">
        <h3 class="stat-heading">2026 IPPONS</h3>
        <div class="stat-value">21 / 19</div>
      </article>
    </div>
  </div>
  <div class="results-line bottom"></div>
</section>
    <section class="journey">
      <div class="container">
        <div class="journey-track">
          <svg class="journey-road">
            <path id="journeyPath"></path>
            <circle id="roadGlow" r="8"></circle>
          </svg>
          <div class="journey-items" id="journeyTimeline"></div>
          </div>
        </div>
      </div>
    </section>
    <div id="footer"></div>
    <script src="./js/results.js"></script>
    <script src="./js/components.js"></script>
  </body>
</html>
