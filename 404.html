<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The requested page could not be found." />
    <script
      src="https://kit.fontawesome.com/424c0b4b20.js"
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/404.css" />
    <title>Page Not Found | Levan Gelashvili</title>
  </head>
  <body class="error-page">
    <div id="header"></div>
    <main class="error-main">
      <section class="error-content" aria-labelledby="errorTitle">
        <p class="error-eyebrow">WRONG TURN</p>
        <h1 class="error-title" id="errorTitle">
          THIS PAGE
          <span>ISN’T HERE.</span>
        </h1>
        <span class="error-divider" aria-hidden="true"></span>
        <p class="error-description">The journey continues somewhere else.</p>
        <a class="error-button" id="goBackButton" href="/">
          <span class="error-button-arrow" aria-hidden="true">←</span>
          <span>GO BACK</span>
        </a>
      </section>
    </main>
    <div id="footer"></div>
    <script src="/js/components.js"></script>
    <script>
      const goBackButton = document.getElementById("goBackButton");
      goBackButton.addEventListener("click", (event) => {
        const referrer = document.referrer;
        try {
          const isInternalPage =
            Boolean(referrer) &&
            new URL(referrer).origin === window.location.origin &&
            history.length > 1;
          if (isInternalPage) {
            event.preventDefault();
            history.back();
          }
        } catch {
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
