      content="Match records, defining moments, lessons, and progression from every competition chapter."

      content="Levan Gelashvili in judogi in Barcelona, with The Journey title."
    />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"

  <body class="competition-page">
    <div id="header"></div>
    <main id="competitionPage">
      <div
        class="competition-loading"
        id="competitionLoading"
        role="status"
        aria-live="polite"
      >
        <span aria-hidden="true"></span>
        <p>OPENING CHAPTER</p>
      </div>
      <div class="competition-content" id="competitionContent"></div>
      <section
        class="competition-error"
        id="competitionError"
        aria-labelledby="competitionErrorTitle"
        hidden
      >
        <p>CHAPTER NOT FOUND</p>
        <h1 id="competitionErrorTitle">This competition could not be found.</h1>
        <a class="site-button" href="./results.html"> Return to the journey </a>
      </section>
    </main>
    <div id="footer"></div>
    <script src="./js/components.js"></script>
    <script type="module" src="./js/competition.js"></script>
  </body>
